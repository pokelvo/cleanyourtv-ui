# CleanYourTV UI settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=BR

# Optional: a Plex Media Server at home, for the Plex tab (what you are watching, Movies and Shows only). Your token:
# on app.plex.tv, open a title > ... > Get Info > View XML, and copy what follows X-Plex-Token= in the address.
# Like the TMDB key, it is built into the app: keep this file to yourself.
plex_url=
plex_token=

# Optional: the app "Live TV" opens (a package, such as com.orange.owtv.tv for Orange TV) instead of the antenna.
live_tv=

# Optional: start the screensaver after this many minutes without a key, set again at every boot (some TVs, such as
# Philips, put "never" back when they start; an OLED screen should not show a still image for hours). 0 = leave it.
screensaver_minutes=0

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=-23.5505
longitude=-46.6333
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), en, es, pt, ru, or de (on Google TV)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=false

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=false)
currency=BRL

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=C

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# The NAS update service (launcher-ui/nas): the home screen asks it for updates and installs them itself.
# Leave empty to check GitHub directly instead (installing is then done from the PC with update.sh).
nas_url=
